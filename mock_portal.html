<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock RTI Filing Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 500px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input, textarea, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: #0284c7; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; font-size: 1rem; }
        button:hover { background: #0369a1; }
        .captcha-box { background: #334155; padding: 12px; text-align: center; font-weight: bold; letter-spacing: 5px; border-radius: 6px; font-size: 1.2rem; color: #38bdf8; user-select: none; }
        #step2, #success_area { display: none; }
        .error-msg { color: #f87171; font-size: 0.9rem; display: none; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏛️ RTI Mock Filing Portal</h2>
        
        <!-- STEP 1: Details & First Dynamic CAPTCHA -->
        <div id="step1">
            <label>Department:</label>
            <input type="text" id="department">
            
            <label style="margin-top: 10px; display: block;">RTI Text:</label>
            <textarea id="rti_text" rows="3"></textarea>
            
            <label style="margin-top: 15px; display: block;">Security Verification (CAPTCHA 1):</label>
            <div class="captcha-box" id="captcha_text_1">------</div>
            <input type="text" id="captcha_input_1" placeholder="Enter CAPTCHA 1">
            <div id="err1" class="error-msg">❌ Invalid CAPTCHA. Please try again.</div>
            
            <button id="next_step">Proceed to Payment & Verify</button>
        </div>

        <!-- STEP 2: Final Payment & Second Dynamic CAPTCHA -->
        <div id="step2">
            <h3>💳 Payment & Final Verification</h3>
            <p>Fee Amount: <strong>₹ 10.00</strong></p>
            
            <label>Final Security Verification (CAPTCHA 2):</label>
            <div class="captcha-box" id="captcha_text_2">------</div>
            <input type="text" id="captcha_input_2" placeholder="Enter CAPTCHA 2">
            <div id="err2" class="error-msg">❌ Invalid CAPTCHA. Please try again.</div>
            
            <button id="pay_submit">Verify CAPTCHA 2 & Pay ₹10</button>
        </div>

        <!-- SUCCESS SCREEN -->
        <div id="success_area">
            <h3 style="color: #4ade80;">✅ Application Submitted Successfully!</h3>
            <p>Registration Number: <strong id="success_reg_number"></strong></p>
        </div>
    </div>

    <script>
        // Generate random alphanumeric string
        function generateCaptcha(length) {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Initialize unique CAPTCHAs on load
        let c1_code = generateCaptcha(5);
        let c2_code = generateCaptcha(5);
        
        document.getElementById('captcha_text_1').innerText = c1_code;
        document.getElementById('captcha_text_2').innerText = c2_code;

        document.getElementById('next_step').addEventListener('click', function() {
            var input1 = document.getElementById('captcha_input_1').value.trim().toUpperCase();
            if (input1 === c1_code) {
                document.getElementById('err1').style.display = 'none';
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            } else {
                document.getElementById('err1').style.display = 'block';
                c1_code = generateCaptcha(5);
                document.getElementById('captcha_text_1').innerText = c1_code;
                document.getElementById('captcha_input_1').value = '';
            }
        });

        document.getElementById('pay_submit').addEventListener('click', function() {
            var input2 = document.getElementById('captcha_input_2').value.trim().toUpperCase();
            if (input2 === c2_code) {
                document.getElementById('err2').style.display = 'none';
                document.getElementById('step2').style.display = 'none';
                
                // Generate dynamic random registration ID
                const randomNum = Math.floor(1000 + Math.random() * 9000);
                document.getElementById('success_reg_number').innerText = 'RTI-GOV-2026-' + randomNum;
                document.getElementById('success_area').style.display = 'block';
            } else {
                document.getElementById('err2').style.display = 'block';
                c2_code = generateCaptcha(5);
                document.getElementById('captcha_text_2').innerText = c2_code;
                document.getElementById('captcha_input_2').value = '';
            }
        });
    </script>
</body>
</html>
